<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWithFriends - Giriş</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>ChatWithFriends</h1>
            <h2>Giriş Yap</h2>
            <form id="loginForm">
                <div class="form-group">
                    <input type="text" id="loginUsername" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="form-group">
                    <input type="password" id="loginPassword" placeholder="Şifre" required>
                </div>
                <button type="submit">Giriş Yap</button>
            </form>
            <div id="loginMessage" class="message"></div>
            <p class="auth-switch">Hesabın yok mu? <a href="register.html">Kayıt Ol</a></p>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
