<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatWithFriends - Kayıt</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>ChatWithFriends</h1>
            <h2>Kayıt Ol</h2>
            <form id="registerForm">
                <div class="form-group">
                    <input type="text" id="registerUsername" placeholder="Kullanıcı Adı" required>
                </div>
                <div class="form-group">
                    <input type="email" id="registerEmail" placeholder="E-posta" required>
                </div>
                <div class="form-group">
                    <input type="password" id="registerPassword" placeholder="Şifre" required>
                </div>
                <button type="submit">Kayıt Ol</button>
            </form>
            <div id="registerMessage" class="message"></div>
            <p class="auth-switch">Zaten hesabın var mı? <a href="index.html">Giriş Yap</a></p>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>
</html>
